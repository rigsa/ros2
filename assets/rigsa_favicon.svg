<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green background square -->
  <rect width="32" height="32" rx="5" fill="#1B7A3C"/>
  <!-- Robot face -->
  <rect x="7" y="10" width="18" height="16" rx="3" fill="none" stroke="#A5D6A7" stroke-width="1.5"/>
  <!-- Eyes -->
  <rect x="10" y="13" width="4" height="4" rx="1" fill="#A5D6A7"/>
  <rect x="18" y="13" width="4" height="4" rx="1" fill="#A5D6A7"/>
  <!-- Mouth -->
  <rect x="11" y="21" width="10" height="2" rx="1" fill="#A5D6A7"/>
  <!-- Antenna -->
  <line x1="16" y1="10" x2="16" y2="6" stroke="#A5D6A7" stroke-width="1.5"/>
  <circle cx="16" cy="4" r="2" fill="#66BB6A"/>
</svg>
