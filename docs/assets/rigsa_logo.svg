<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="200" height="52">
  <!-- Robot head icon -->
  <rect x="3" y="13" width="26" height="26" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <!-- Eyes -->
  <rect x="8" y="18" width="6" height="6" rx="2" fill="white"/>
  <rect x="16" y="18" width="6" height="6" rx="2" fill="white"/>
  <!-- Mouth -->
  <rect x="9" y="29" width="12" height="3" rx="1.5" fill="white"/>
  <!-- Antenna -->
  <line x1="16" y1="13" x2="16" y2="7" stroke="white" stroke-width="2"/>
  <circle cx="16" cy="5" r="3" fill="#A5D6A7"/>
  <!-- Ears -->
  <rect x="0" y="21" width="3" height="8" rx="1.5" fill="white"/>
  <rect x="29" y="21" width="3" height="8" rx="1.5" fill="white"/>
  <!-- RIGSA wordmark -->
  <text x="38" y="36"
        font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif"
        font-size="24" font-weight="700" fill="white" letter-spacing="2">RIGSA</text>
</svg>
